<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Open Graph Preview - Victor Hugo Sanches</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
    background: linear-gradient(135deg, #eaf3f8 0%, #f5f9fc 40%, #ffffff 100%);
    display: flex;
    overflow: hidden;
    position: relative;
  }
  .left {
    flex: 1;
    padding: 64px 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    z-index: 1;
  }
  .label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #2f769d;
  }
  .title {
    font-size: 56px;
    font-weight: 700;
    color: #163d58;
    line-height: 1.1;
  }
  .title em {
    font-style: italic;
    font-family: 'Georgia', serif;
    color: #2f769d;
  }
  .desc {
    font-size: 18px;
    color: #5c737f;
    line-height: 1.5;
    max-width: 420px;
  }
  .tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .tag {
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(47, 118, 157, 0.1);
    color: #2f769d;
    font-size: 13px;
    font-weight: 600;
  }
  .url {
    margin-top: 12px;
    font-size: 14px;
    color: #8fa3af;
    font-weight: 500;
  }
  .right {
    width: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .photo-circle {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 24px 48px rgba(22, 61, 88, 0.18);
  }
  .photo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .badge {
    position: absolute;
    bottom: 120px;
    right: 40px;
    background: #ffffff;
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow: 0 8px 24px rgba(22, 61, 88, 0.12);
    text-align: center;
  }
  .badge-number {
    font-size: 28px;
    font-weight: 700;
    color: #163d58;
    display: block;
  }
  .badge-text {
    font-size: 11px;
    color: #5c737f;
    line-height: 1.3;
  }
  .decoration {
    position: absolute;
    top: 0;
    right: 0;
    width: 500px;
    height: 100%;
    background: radial-gradient(circle at 80% 30%, rgba(47, 118, 157, 0.06) 0%, transparent 60%);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="decoration"></div>
  <div class="left">
    <span class="label">Full-Stack & Ciência de Dados</span>
    <h1 class="title">Desenvolvedor<br><em>Full-Stack</em></h1>
    <p class="desc">Estudante de Ciência de Dados com experiência prática construindo sistemas reais. Foco em dados, automação e eficiência.</p>
    <div class="tags">
      <span class="tag">Next.js</span>
      <span class="tag">React</span>
      <span class="tag">Python</span>
      <span class="tag">Supabase</span>
      <span class="tag">TypeScript</span>
    </div>
    <span class="url">sawxor19.github.io/portfolio.html</span>
  </div>
  <div class="right">
    <div class="photo-circle">
      <img src="image0.jpeg" alt="Victor Hugo Sanches">
    </div>
    <div class="badge">
      <span class="badge-number">5</span>
      <span class="badge-text">Projetos<br>no Portfólio</span>
    </div>
  </div>
</body>
</html>
